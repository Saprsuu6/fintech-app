<!-- htmlhint attr-lowercase:false -->
<div class="cards-list">
  <div class="cards-summary">
    <div class="summary-chip">
      <span class="chip-label">Активно:</span>
      <span class="chip-value">{{ activeCardsCount() }}</span>
    </div>

    @if (hasBlockedCards()) {
      <div class="warning-chip">
        <span class="warning-icon">⚠️</span>
        <span>Есть блокировки</span>
      </div>
    }
  </div>

  <div class="cards-grid">
    @for (card of cards(); track card.id) {
      <app-card-item [card]="card" (blockToggled)="onToggleBlock($event)" />
    } @empty {
      <div class="empty-state">
        <div class="empty-icon">💳</div>
        <p class="empty-text">Нет добавленных карт</p>
      </div>
    }
  </div>
</div>
